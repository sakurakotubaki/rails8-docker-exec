default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: db
  username: general_user                # ← ユーザー名を「general_user」に変更
  password: password                    # ← パスワードはそのまま

development:
  <<: *default
  database: dev_db                      # ← データベース名を「dev_db」に変更

test:
  <<: *default
  database: dev_db_test                 # ← テスト用データベース名も変更

production:
  <<: *default
  database: dev_db_production           # ← 本番用データベース名も変更
  username: general_user                # ← ユーザー名を「general_user」に変更
  password: <%= ENV["DEV_DB_DATABASE_PASSWORD"] %>  # ← 環境変数名も調整