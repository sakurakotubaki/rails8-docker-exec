services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev  # もしくは Dockerfile
    command: bash -c "tail -f /dev/null"  # コンテナを起動し続けるための一時的な対応
    tty: true
    # 以下は変更なし
    volumes:
      - .:/rails
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://postgres:password@db:5432/rails_development
      - POSTGRES_PASSWORD=password
    depends_on:
      - db

  db:
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"

volumes:
  postgres_data: